name: sitemap-submit

on:
  push:
    branches: [main]
    paths:
      - "public/sitemap*.xml"
      - "public/robots.txt"
      - "scripts/generate-sitemap*.mjs"
      - "scripts/generate-sitemap*.ts"
  schedule:
    # Diariamente 04:15 UTC — mantém Google/Bing sincronizados sem intervenção manual.
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping Google Search Console (sitemap)
        run: |
          set -e
          SITEMAP="https://tecnicocuritiba.com.br/sitemap.xml"
          echo "→ Google ping: $SITEMAP"
          code=$(curl -sS -o /tmp/google.txt -w "%{http_code}" "https://www.google.com/ping?sitemap=$SITEMAP" || true)
          echo "Google HTTP $code"
          cat /tmp/google.txt || true
      - name: Ping Bing Webmaster Tools (sitemap)
        run: |
          set -e
          SITEMAP="https://tecnicocuritiba.com.br/sitemap.xml"
          echo "→ Bing ping: $SITEMAP"
          code=$(curl -sS -o /tmp/bing.txt -w "%{http_code}" "https://www.bing.com/ping?sitemap=$SITEMAP" || true)
          echo "Bing HTTP $code"
          cat /tmp/bing.txt || true
      - name: IndexNow (Bing/Yandex batch)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY ausente — pulando IndexNow."
            exit 0
          fi
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"tecnicocuritiba.com.br\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[\"https://tecnicocuritiba.com.br/sitemap.xml\"]}" \
            -w "\nIndexNow HTTP %{http_code}\n"
