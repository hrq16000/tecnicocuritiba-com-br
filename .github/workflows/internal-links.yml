name: Internal links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # The production Nitro preset emits a Cloudflare Worker, not dist/server/server.js.
      - name: Install pinned Wrangler preview runtime
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --yes --package=wrangler@4.169.0 -- wrangler --version
      - name: Start preview
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -f .output/server/wrangler.json
          npm exec --yes --package=wrangler@4.169.0 -- wrangler dev --config .output/server/wrangler.json --ip 127.0.0.1 --port 4173 --local > preview.log 2>&1 &
      - name: Wait for preview
        run: |
          for i in {1..60}; do
            curl -sf http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          echo "preview Nitro/Cloudflare não retornou 2xx"; tail -n 35 preview.log; exit 1
      - name: Check internal links + sitemap URLs
        run: node scripts/check-internal-links.mjs
        env:
          PREVIEW_URL: http://127.0.0.1:4173
