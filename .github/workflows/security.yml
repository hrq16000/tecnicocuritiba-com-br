name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC re-scan to catch drift in dependencies.
    - cron: "0 6 * * 1"
    # Daily 09:00 UTC (06:00 em Curitiba) — gates de privacidade/headers com alerta.
    - cron: "0 9 * * *"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  audit:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1) Fail the build on high/critical npm vulnerabilities.
      - name: npm audit (high+critical)
        run: |
          set -e
          bunx --bun npm audit --audit-level=high --json > audit.json || true
          node -e "const r=require('./audit.json');const m=r.metadata?.vulnerabilities||{};const bad=(m.high||0)+(m.critical||0);console.log('high:',m.high,'critical:',m.critical);if(bad>0){process.exit(1)}"

      # 2) Block secrets being committed. Official MIT-licensed CLI, pinned by
      # immutable digest; scan the fetched git history, redact findings and
      # keep non-zero exit codes blocking. No repository credentials in container.
      - name: Gitleaks secret scan
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d)"
          trap 'rm -rf "$report_dir"' EXIT
          scan_status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            --volume "$report_dir:/reports:rw" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --no-banner --log-opts="--all" \
            --report-format=json --report-path=/reports/gitleaks.json . || scan_status=$?
          # Only metadata; never emit raw matches, secret values, or authors.
          if [ -f "$report_dir/gitleaks.json" ]; then
            node -e 'const rows=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); for(const row of rows) console.log(JSON.stringify({rule:row.RuleID,file:row.File,line:row.StartLine,commit:row.Commit}));' "$report_dir/gitleaks.json"
          fi
          exit "$scan_status"

      # 3) Static analysis on JS/TS.
      - name: Semgrep (OWASP/React rulesets)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/react

      # 4) Guard against regressions in security HTTP headers.
      - name: Verify security headers in public/_headers
        run: bun scripts/check-security-headers.ts

      # 5) Guard against tables shipping without RLS.
      - name: Verify every public-schema CREATE TABLE has RLS + GRANT
        run: bun scripts/check-rls-migrations.ts

      # 6) Guard against SEO regressions on the landing shell (title / desc / unique H1).
      - name: Verify SEO basics on rendered SSR homepage
        run: |
          bun run build
          bash scripts/start-worker-preview.sh 8080
          curl -fsS http://127.0.0.1:8080/ -o "$RUNNER_TEMP/seo-home.html"
          bun scripts/check-seo-basics.ts "$RUNNER_TEMP/seo-home.html"
          node scripts/check-adsense.mjs --html "$RUNNER_TEMP/seo-home.html"

      # 7) Block CNPJ / número de WhatsApp visível em superfícies publicadas.
      - name: Brand privacy gate (sem CNPJ, sem WhatsApp visível)
        run: npm run check:brand-privacy

      # 8) Headers de segurança (HSTS, Referrer-Policy, nosniff, CSP/XFO) nas
      #    rotas críticas da produção — falha se algum sair do padrão.
      - name: Security headers nas rotas críticas (produção, live)
        run: npm run check:route-headers

      # 9) Privacidade das reviews usando SOMENTE a chave pública (anon).
      #    Requer secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório;
      #    sem eles o gate é pulado com notice (nunca usa chave privilegiada).
      - name: Detect Supabase secrets
        id: supa
        env:
          SUPA_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPA_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets SUPABASE_URL/SUPABASE_ANON_KEY ausentes — gate de reviews pulado"
          fi

      - name: Reviews privacy gate (client_phone/client_contact negados p/ anon)
        if: steps.supa.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run check:reviews-privacy

      # 10) Alerta: abre issue no repositório quando o scan AGENDADO falha.
      - name: Abrir issue de alerta (scan agendado falhou)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = "🚨 Security watch falhou";
            const title = `${marker} (${new Date().toISOString().slice(0, 10)})`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 30,
            });
            if (openIssues.some((i) => i.title.startsWith(marker))) {
              core.info("Já existe issue aberta de security-watch — sem duplicar.");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                "O scan de segurança agendado falhou.",
                "",
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                "",
                "Verifique os logs do job `audit` (privacidade de reviews, headers de segurança, CNPJ/WhatsApp, auditoria de dependências).",
              ].join("\n"),
            });
