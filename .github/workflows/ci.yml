name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Lint (non-blocking warnings)
        run: npm run lint --silent || echo "::warning::lint reported issues"
      - name: CTA funnel gate
        run: npm run check:cta-funnel
      - name: Build
        run: npm run build
      - name: Sitemap /problemas/* guard (189 unique)
        run: node scripts/check-sitemap-problemas.mjs
      - name: /problemas/* internal-link guard (whitelist canônica)
        run: node scripts/check-problemas-internal-links.mjs
      - name: Brand consistency (og:site_name / Organization.name / LocalBusiness.name)
        run: node scripts/check-brand-consistency.mjs
      - name: JSON-LD validation
        run: npm run validate:jsonld

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
        env:
          CI: "true"
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Run targeted E2E (whatsapp + termos + sitemap + como-funciona + nap + a11y skip-link + seo h1/title dedup)
        run: npx playwright test e2e/whatsapp-funnel.spec.ts e2e/termos-e-condicoes.spec.ts e2e/seo-sitemap-robots.spec.ts e2e/como-funciona-mobile.spec.ts e2e/nap-consistency.spec.ts e2e/a11y-skiplink.spec.ts e2e/seo-h1.spec.ts e2e/seo-title-dedup.spec.ts --retries=1 --trace=retain-on-failure
        env:
          E2E_BASE_URL: http://localhost:8080
          CI: "true"
      - name: Upload titles-dump.csv on failure (seo-title-dedup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titles-dump
          path: test-results/**/titles-dump.csv
          if-no-files-found: ignore
      - name: Upload Playwright traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
          if-no-files-found: ignore

  indexnow:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes in service/neighborhood pages
        id: changes
        run: |
          set -e
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD || true)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/pages/(servicos|bairros|arrumar-pc|servico-bairro|cftv|hubs)/|src/pages/Tecnico|src/pages/Conserto|public/sitemap)'; then
            echo "ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "ping=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem mudanças em páginas de serviço/bairro/sitemap — IndexNow pulado."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ping == 'true'
        with:
          node-version: "20"
      - name: Ping IndexNow with sitemap URLs
        if: steps.changes.outputs.ping == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: tecnicocuritiba.com.br
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY ausente — pulando ping."
            exit 0
          fi
          node scripts/indexnow-ping.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.13.x
      - name: Build
        run: npm run build
      - name: Lighthouse (desktop + mobile, non-blocking)
        run: |
          npm run lh:desktop || echo "::warning::lh desktop falhou"
          npm run lh:mobile || echo "::warning::lh mobile falhou"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore


